name: Zalith local import package
on:
  workflow_dispatch:
    inputs:
      native_run_id:
        description: Successful unified native build run ID
        required: true
        default: '39412955913'
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - uses: actions/download-artifact@v4
        with:
          pattern: powervr-unified-*
          path: .work/native
          run-id: ${{ inputs.native_run_id }}
          github-token: ${{ github.token }}
      - name: Package both ARM ABIs for original Zalith
        run: >-
          python3 tools/package_zalith.py
          --build-zip .work/native/powervr-unified-arm64-v8a/powervr-unified.zip
          --build-zip .work/native/powervr-unified-armeabi-v7a/powervr-unified.zip
      - uses: actions/upload-artifact@v4
        with:
          name: powervr-zalith-local-import
          path: artifacts/powervr-zalith-local.zip
          if-no-files-found: error
