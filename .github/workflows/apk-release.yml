name: ARM universal APK prerelease
on:
  push:
    branches: [arena/b3c523aa-powervr-the-poop]
    paths: [android-plugin/**, tools/package_apk.py, .github/workflows/apk-release.yml]
permissions:
  contents: read
  actions: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Install Android packaging tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0' 'platforms;android-35' > /dev/null
      - uses: actions/download-artifact@v4
        with:
          pattern: powervr-unified-*
          path: .work/native
          run-id: '39445672159'
          github-token: ${{ github.token }}
      - name: Build and verify signed APK and source bundle
        run: >-
          python3 tools/package_apk.py
          --build-zip .work/native/powervr-unified-arm64-v8a/powervr-unified.zip
          --build-zip .work/native/powervr-unified-armeabi-v7a/powervr-unified.zip
      - uses: actions/upload-artifact@v4
        with:
          name: powervr-arm-universal-apk-release
          path: artifacts/release/*
          if-no-files-found: error
  publish:
    needs: apk
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: powervr-arm-universal-apk-release
          path: release
      - name: Publish experimental release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create v0.2.0-experimental release/*
          --target "$GITHUB_SHA"
          --title 'PowerVR Unified r2 — ARM universal APK (experimental)'
          --notes-file docs/APK.md
          --prerelease
