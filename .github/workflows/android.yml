name: Android GL4ES build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake
        run: python3 -m pip install cmake==3.31.6
      - name: Test build tooling
        run: python3 -m unittest discover -s tests -v
      - name: Install pinned NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.2.12479018' > /dev/null
      - name: Build native library
        run: python3 tools/build.py --ndk "$ANDROID_HOME/ndk/27.2.12479018" --abi '${{ matrix.abi }}'
      - uses: actions/upload-artifact@v4
        with:
          name: powervr-gl4es-${{ matrix.abi }}
          path: artifacts/${{ matrix.abi }}/powervr-safe.zip
          if-no-files-found: error

  combined:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake
        run: python3 -m pip install cmake==3.31.6
      - name: Test tooling and routing
        run: python3 -m unittest discover -s tests -v
      - name: Install pinned NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358' > /dev/null
      - name: Build LTW and Krypton from source
        run: python3 tools/build_combined.py --ndk "$ANDROID_HOME/ndk/28.2.13676358" --abi '${{ matrix.abi }}' --jobs 2
      - uses: actions/upload-artifact@v4
        with:
          name: powervr-combined-${{ matrix.abi }}
          path: artifacts/${{ matrix.abi }}/powervr-combined.zip
          if-no-files-found: error

  unified:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake
        run: python3 -m pip install cmake==3.31.6
      - name: Test tooling and integrated native code
        run: python3 -m unittest discover -s tests -v
      - name: Install pinned NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358' > /dev/null
      - name: Build one integrated renderer
        run: python3 tools/build_unified.py --ndk "$ANDROID_HOME/ndk/28.2.13676358" --abi '${{ matrix.abi }}' --jobs 2
      - uses: actions/upload-artifact@v4
        with:
          name: powervr-unified-${{ matrix.abi }}
          path: artifacts/${{ matrix.abi }}/powervr-unified.zip
          if-no-files-found: error
      - name: Package fresh build for original Zalith local import
        run: >-
          python3 tools/package_zalith.py
          --build-zip artifacts/${{ matrix.abi }}/powervr-unified.zip
          --output artifacts/${{ matrix.abi }}/powervr-zalith-r2.zip
      - uses: actions/upload-artifact@v4
        with:
          name: powervr-zalith-r2-${{ matrix.abi }}
          path: artifacts/${{ matrix.abi }}/powervr-zalith-r2.zip
          if-no-files-found: error
